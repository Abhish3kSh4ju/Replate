services:
  - type: web
    name: replate
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd food_management && gunicorn food_management.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.9.10"
