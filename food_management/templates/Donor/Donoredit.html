<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - RePlate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #f0f7ee;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(106, 176, 76, 0.2);
            box-shadow: 4px 0 24px rgba(50, 120, 50, 0.07);
            padding: 28px 16px 20px;
            display: flex;
            flex-direction: column;
            z-index: 999;
            transition: left 0.3s;
        }

        @media (max-width: 992px) {
            .sidebar {
                left: -280px;
            }

            .sidebar.active {
                left: 0;
            }
        }

        .sidebar-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(106, 176, 76, 0.18);
            margin-bottom: 14px;
        }

        .sidebar-brand img {
            width: 110px;
        }

        .sidebar-brand span {
            font-size: 10px;
            font-weight: 600;
            color: #7ab870;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .menu-links {
            flex: 1;
        }

        .sidebar a {
            color: #3a4a3a;
            text-decoration: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar a i {
            color: #6ab06a;
            font-size: 17px;
        }

        .sidebar a:hover {
            background: rgba(100, 180, 100, 0.1);
            color: #2d7a2d;
        }

        .sidebar a.active {
            background: rgba(100, 180, 100, 0.12);
            color: #2d7a2d;
            font-weight: 600;
        }

        .sidebar-logout {
            border-top: 1px solid rgba(106, 176, 76, 0.15);
            padding-top: 15px;
        }

        .sidebar-logout a {
            color: #c0392b !important;
        }

        /* ───────── MENU BUTTON ───────── */

        .menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #2d7a2d;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(50, 120, 50, 0.1);
        }

        @media (max-width: 992px) {
            .menu-btn {
                display: flex;
            }
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 998;
        }

        #overlay.active {
            display: block;
        }

        /* MAIN CONTENT */

        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        @media (max-width: 992px) {
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }

        /* PROFILE CARD (Similar to food-card) */

        .profile-card {
            background: white;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card h2 {
            font-weight: 700;
            color: #198754;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: none;
            border-color: #198754;
        }

        /* PHOTO UPLOAD BOX (Similar to upload-box) */

        .photo-upload-box {
            border: 2px dashed #9ad29a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            background: #f9fff8;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            margin-bottom: 30px;
        }

        .photo-upload-box:hover {
            background: #f3fff0;
        }

        .preview-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .upload-icon {
            font-size: 40px;
            color: #198754;
            margin-bottom: 10px;
        }

        .submit-btn {
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- MENU BUTTON -->
    <div class="menu-btn" onclick="toggleMenu()">
        <i class="bi bi-list"></i>
    </div>

    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../static/Re_plate logo.png" alt="Replate Logo">
            <span>Donor Panel</span>
        </div>

        <div class="menu-links">
            <a href="{% url 'Donorpanel' %}">
                <i class="bi bi-house-door-fill"></i> Dashboard
            </a>
            <a href="{% url 'Donoraddfood' %}">
                <i class="bi bi-plus-circle-fill"></i> Add Food
            </a>
            <a href="{% url 'Donorlisting' %}">
                <i class="bi bi-card-checklist"></i> My Listings
            </a>
            <a href="{% url 'Donorrequest' %}">
                <i class="bi bi-clipboard-check-fill"></i>
                Requests
            </a>
            <a href="{% url 'Donornotification' %}">
                <i class="bi bi-bell-fill"></i> Notifications
            </a>
            <a href="{% url 'Donorcomplaint' %}">
                <i class="bi bi-exclamation-circle-fill"></i> Complaints
            </a>
            <a href="{% url 'Donorfeedback' %}">
                <i class="bi bi-chat-fill"></i> Feedback
            </a>
            <a href="{% url 'Donorprofile' %}" class="active">
                <i class="bi bi-person-circle"></i> Profile
            </a>
        </div>

        <div class="sidebar-logout">
            <a href="{% url 'Logout' %}">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="profile-card">
            <h2>
                <i class="bi bi-person-circle me-2"></i>
                Edit Profile Details
            </h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row">
                    <!-- PROFILE PHOTO -->
                    <div class="col-lg-12">
                        <label class="form-label">Profile Photo</label>
                        <div class="photo-upload-box" onclick="document.getElementById('profile-photo').click()">
                            {% if donor.image %}
                            <img src="{{ donor.image.url }}" id="image-preview" class="preview-circle">
                            {% else %}
                            <div class="upload-icon"><i class="bi bi-camera-fill"></i></div>
                            <h5 class="mb-2">Click to Upload Photo</h5>
                            {% endif %}
                            <input type="file" id="profile-photo" name="image" class="d-none"
                                onchange="previewImage(event)">
                            <p class="text-muted small mb-0">JPEG or PNG, Max 2MB</p>
                        </div>
                    </div>

                    <!-- DONOR NAME -->
                    <div class="col-lg-6 mb-4">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="donorname" class="form-control"
                            value="{{ donor.donorname|default:'' }}" placeholder="Enter your full name">
                    </div>

                    <!-- PHONE NUMBER -->
                    <div class="col-lg-6 mb-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" value="{{ donor.phone|default:'' }}"
                            placeholder="Enter phone number">
                    </div>

                    <!-- EMAIL ADDRESS -->
                    <div class="col-lg-6 mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ donor.email|default:'' }}"
                            placeholder="Enter email address">
                    </div>

                    <!-- DATE OF JOINING -->
                    <div class="col-lg-6 mb-4">
                        <label class="form-label">Date of Joining</label>
                        <input type="date" name="date_of_joining" class="form-control"
                            value="{{ donor.date_of_joining|date:'Y-m-d' }}">
                    </div>

                    <!-- PICKUP LOCATION -->
                    <div class="col-lg-12 mb-4">
                        <label class="form-label">Pickup Location</label>
                        <input type="text" name="pickup_location" class="form-control"
                            value="{{ donor.pickup_location|default:'' }}"
                            placeholder="Example: Near City Park, Gate 2">
                    </div>

                    <!-- ADDRESS -->
                    <div class="col-lg-12 mb-4">
                        <label class="form-label">Full Address</label>
                        <textarea name="address" class="form-control" rows="4"
                            placeholder="Enter your detailed address">{{ donor.address|default:'' }}</textarea>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <div class="col-lg-12 mt-2">
                        <button type="submit" class="btn btn-success w-100 submit-btn">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Save Changes
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('image-preview');
                if (!output) {
                    // If no image-preview exists (initial upload), create it
                    const wrapper = event.target.parentElement;
                    wrapper.innerHTML = `<img id="image-preview" class="preview-circle">` + wrapper.innerHTML;
                    document.getElementById('image-preview').src = reader.result;
                } else {
                    output.src = reader.result;
                }
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>

</html>
