<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Replate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .main-container {
            min-height: 100vh;
            background: url('../static/replate\ login\ background.png') center center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow: hidden;
        }

        .inner-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1050px;
            gap: 40px;
        }

        /* ── LEFT TEXT ── */
        .intro-text {
            flex: 1;
            padding: 40px 20px;
            animation: slideInLeft 0.8s ease both;
        }

        .intro-text h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 50px;
            font-weight: 700;
            color: #1e4d1a;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .intro-text h1 span {
            color: #5aaa35;
        }

        .intro-text p {
            font-size: 15.5px;
            font-weight: 300;
            color: #4a6e42;
            line-height: 1.8;
            max-width: 420px;
        }

        .intro-text:hover h1 {
            transform: translateY(-4px);
            transition: transform 0.3s;
        }

        /* ── LOGIN CARD ── */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(106, 176, 76, 0.25);
            box-shadow:
                0 20px 60px rgba(50, 120, 50, 0.12),
                0 2px 8px rgba(50, 120, 50, 0.06);
            flex-shrink: 0;
            animation: slideInRight 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-wrapper img {
            width: 160px;
            height: auto;
            display: inline-block;
        }

        .card-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(106,176,76,0.3), transparent);
            margin-bottom: 24px;
        }

        .login-card label {
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.4px;
            color: #3a6e34;
            margin-bottom: 6px;
            display: block;
        }

        .form-control {
            background: rgba(240, 250, 240, 0.8) !important;
            border: 1.5px solid rgba(106, 176, 76, 0.3);
            color: #1e3d1a !important;
            box-shadow: none !important;
            border-radius: 12px;
            padding: 11px 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: rgba(80, 130, 70, 0.5);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.95) !important;
            border-color: #5aaa35;
            box-shadow: 0 0 0 3px rgba(90, 170, 53, 0.12) !important;
            color: #1e3d1a !important;
        }

        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus,
        .form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 999px rgba(240, 250, 240, 0.95) inset !important;
            -webkit-text-fill-color: #1e3d1a !important;
            caret-color: #1e3d1a;
            border: 1.5px solid rgba(106, 176, 76, 0.3) !important;
            transition: background-color 9999s ease-in-out 0s;
        }

        .password-container {
            position: relative;
        }

        .password-container i {
            position: absolute;
            top: 50%;
            right: 13px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7ab870;
            font-size: 15px;
            transition: color 0.2s;
            margin-top: 10px;
        }

        .password-container i:hover {
            color: #3a7d2c;
        }

        .btn-login {
            background: linear-gradient(135deg, #6abf47, #3d8f25);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            width: 100%;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(60, 140, 36, 0.3);
            margin-top: 4px;
        }

        .btn-login:hover {
            opacity: 0.93;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(60, 140, 36, 0.4);
            color: #fff;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .signup-text {
            font-size: 13px;
            color: #5a7a55;
            text-align: center;
            margin-top: 16px;
        }

        .signup-text a {
            color: #3a8c20;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* ── ANIMATIONS ── */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── TABLET ── */
        @media (max-width: 991px) {
            .inner-row {
                flex-direction: column;
                align-items: center;
                gap: 24px;
                padding: 20px 0;
            }

            .intro-text {
                text-align: center;
                padding: 20px 24px 0;
                animation: slideInDown 0.7s ease both;
            }

            .intro-text h1 { font-size: 38px; }
            .intro-text p  { font-size: 14px; margin: 0 auto; }

            .login-card {
                max-width: 440px;
                width: 92%;
                animation: slideInUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            }
        }

        /* ── MOBILE ── */
        @media (max-width: 575px) {
            .main-container {
                padding: 20px 14px;
                align-items: flex-start;
                padding-top: 36px;
            }

            .intro-text h1 { font-size: 28px; }
            .intro-text p  { font-size: 13px; }

            .login-card {
                width: 100%;
                max-width: 100%;
                padding: 28px 20px;
                border-radius: 18px;
            }

            .logo-wrapper img { width: 130px; }

            .form-control {
                font-size: 13.5px;
                padding: 10px 12px;
            }

            .btn-login {
                font-size: 14px;
                padding: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <div class="inner-row">

            <!-- LEFT -->
            <div class="intro-text">
                <h1>Reduce Food Waste,<br><span>Feed the World</span></h1>
                <p>
                    Join our platform to donate excess food and help those in need.
                    Together, we can create a sustainable and hunger-free community.
                </p>
            </div>

            <!-- RIGHT -->
            <div class="login-card">

                <div class="logo-wrapper">
                    <img src="../static/Re_plate logo.png" alt="Replate Logo">
                </div>

                <div class="card-divider"></div>

                <form method="POST" autocomplete="on">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label><i class="bi bi-person me-1"></i>Username</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter your username" autocomplete="username">
                    </div>

                    <div class="mb-3 password-container">
                        <label></i>Password</label>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="Enter your password"
                               autocomplete="current-password">
                        <i class="bi bi-eye-slash" id="togglePassword"></i>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>

                    <p class="signup-text">
                        Don't have an account?
                        <a href="Register">Sign up</a>
                    </p>
                </form>

            </div>

        </div>
    </div>

    <!-- JS -->
    <script>
        const togglePassword = document.querySelector("#togglePassword");
        const password = document.querySelector("#password");

        togglePassword.addEventListener("click", function () {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            this.classList.toggle("bi-eye");
            this.classList.toggle("bi-eye-slash");
        });
    </script>

</body>
</html>
