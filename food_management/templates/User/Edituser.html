<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Profile-edit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #f0f7ee;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(106, 176, 76, 0.2);
            box-shadow: 4px 0 24px rgba(50, 120, 50, 0.07);
            padding: 28px 16px 20px;
            display: flex;
            flex-direction: column;
            z-index: 999;
            transition: left 0.3s;
        }

        .sidebar-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(106, 176, 76, 0.18);
            margin-bottom: 14px;
        }

        .sidebar-brand img {
            width: 110px;
        }

        .sidebar-brand span {
            font-size: 10px;
            font-weight: 600;
            color: #7ab870;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .menu-links {
            flex: 1;
        }

        .sidebar a {
            color: #3a4a3a;
            text-decoration: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar a i {
            color: #6ab06a;
            font-size: 17px;
        }

        .sidebar a:hover {
            background: rgba(100, 180, 100, 0.1);
            color: #2d7a2d;
        }

        .sidebar a.active {
            background: rgba(100, 180, 100, 0.12);
            color: #2d7a2d;
            font-weight: 600;
        }

        .sidebar-logout {
            border-top: 1px solid rgba(106, 176, 76, 0.15);
            padding-top: 15px;
        }

        .sidebar-logout a {
            color: #c0392b;
        }

        .menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 26px;
            color: #2d7a2d;
            z-index: 1000;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(50, 120, 50, 0.1);
        }

        @media (max-width: 992px) {
            .menu-btn {
                display: flex;
            }

            .sidebar {
                left: -260px;
            }

            .sidebar.active {
                left: 0;
            }
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 998;
        }

        #overlay.active {
            display: block;
        }

        .main {
            margin-left: 240px;
            padding: 28px 24px;
            min-height: 100vh;
            transition: margin-left 0.3s;
        }

        @media (max-width: 992px) {
            .main {
                margin-left: 0;
                padding-top: 64px;
            }
        }

        /* EDIT FORM CARD */

        .edit-card {
            background: white;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
            max-width: 1100px;
        }

        .edit-card h3 {
            color: #198754;
        }

        .form-label {
            font-weight: 600;
            color: #198754;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #dcdcdc;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: none;
            border-color: #198754;
        }

        .save-btn {
            border-radius: 12px;
            padding: 10px 28px;
            font-weight: 500;
        }

        .cancel-btn {
            border-radius: 12px;
            padding: 10px 28px;
            font-weight: 500;
        }
    </style>

</head>

<body>
    <div class="menu-btn" onclick="toggleMenu()">
        <i class="bi bi-list"></i>
    </div>

    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../static/Re_plate logo.png" alt="Replate Logo">
            <span>User Panel</span>
        </div>

        <div class="menu-links">
            <a href="{% url 'Userpanel' %}">
                <i class="bi bi-house-door-fill"></i> Dashboard
            </a>
            <a href="{% url 'Userprofile' %}" class="active">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
            <a href="{% url 'Orders' %}">
                <i class="bi bi-bag-fill"></i> Orders
            </a>
            <a href="{% url 'Usernotification' %}">
                <i class="bi bi-bell-fill"></i> Notifications
            </a>
            <a href="{% url 'Usercomplaints' %}">
                <i class="bi bi-exclamation-circle-fill"></i> Complaints
            </a>
            <a href="{% url 'Userfeedback' %}">
                <i class="bi bi-chat-fill"></i> Feedback
            </a>
        </div>

        <div class="sidebar-logout">
            <a href="{% url 'Logout' %}">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="edit-card">

            <h3 class="fw-bold mb-4">
                <i class="bi bi-pencil-square me-2"></i>
                Edit Profile
            </h3>

            <form method="post" action="{% url 'Edituser' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="number" name="phone" class="form-control" value="{{ user.phone }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
                        <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}">
                </div>

                <div class="mb-4">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3">{{ user.address }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success save-btn">
                        <i class="bi bi-check2-circle me-2"></i>
                        Save Changes
                    </button>

                    <a href="{% url 'Userprofile' %}" class="btn btn-outline-secondary cancel-btn">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>

</body>

</html>
